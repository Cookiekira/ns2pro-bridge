[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Cookiekira/ns2pro-bridge"
readme = "README.md"

[workspace.dependencies]
ns2pro-proto = { path = "crates/ns2pro-proto", version = "0.3.1" }
ns2pro-usb = { path = "crates/ns2pro-usb", version = "0.3.1" }

aes = "0.9"
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Futures are intentionally !Send: the bridge runs on a current-thread tokio runtime.
future_not_send = "allow"
# Duplicates are transitive; removing them needs dependency upgrades.
multiple_crate_versions = "allow"
# Conflicts with rustc `unreachable_pub`, which this workspace enables instead.
redundant_pub_crate = "allow"
# `async fn` trait impls defer side effects to first poll; `ready()` would run them eagerly.
unused_async_trait_impl = "allow"
# Curated restriction lints; the group as a whole is self-contradictory.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Panic and cast freedom outside tests (test allowances live in clippy.toml).
as_conversions = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
