name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Pinned jobs install the toolchain from rust-toolchain.toml.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets
        env:
          CARGO_BUILD_WARNINGS: deny
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Native Bluetooth smoke when an adapter is available
        shell: bash
        run: |
          if compgen -G '/sys/class/bluetooth/hci*' >/dev/null; then
            cargo build --locked -p ns2pro-bridge
            sudo target/debug/ns2pro-bridge --bt-smoke-test
          else
            echo 'SKIP native Bluetooth smoke: no adapter on runner'
          fi
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - run: cargo build --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets
        env:
          CARGO_BUILD_WARNINGS: deny
      - run: cargo test --locked --workspace
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - run: cargo build --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets
        env:
          CARGO_BUILD_WARNINGS: deny
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  # Surfaces breakage from new stable releases before the pin is bumped.
  latest-stable:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets
        env:
          CARGO_BUILD_WARNINGS: deny
      - run: cargo test --locked --workspace
  # Verifies the `rust-version` promise in Cargo.toml. Cargo 1.88 predates
  # `build.warnings`, so warnings are denied through RUSTFLAGS here.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: "1.88"
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
